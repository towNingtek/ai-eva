function ai(html){const e=document.createElement('div');e.className='message';e.innerHTML='<div class="avatar">Eva</div><div><div class="who">AI-Eva</div>'+html+'</div>';$('stream').append(e);scroll();return e}function user(text){const e=document.createElement('div');e.className='user';e.innerHTML='<p>'+esc(text)+'</p>';$('stream').append(e);scroll()}function scroll(){requestAnimationFrame(()=>$('thread').scrollTop=$('thread').scrollHeight)}function reset(){if(timer)clearTimeout(timer);seq++;$('stream').innerHTML='';currentId=null;ai('<div class="welcome"><h1>把判斷說清楚，讓下一步有依據。</h1><p>今天想一起看哪個專案？你可以開始媒合分析，或進行法規檢核。</p><div class="chips"><button onclick="choose(\'match\')">🤝 媒合分析</button><button onclick="choose(\'law\')">⚖ 法規檢核</button></div></div>')}function choose(mode){currentMode=mode;user('我想做'+names[mode]);const id=++seq;ai('<p>好，先確認本次分析對象。接下來的條件、進度與結果，都會留在這份分析裡。</p>'+frame(mode,id,'setup'));scroll()}

function steps(n){return '<ol class="steps">'+['確認對象','比對條件','整理結果'].map((t,i)=>'<li class="'+(i<=n?'done':'')+'">'+(i+1)+' '+t+'</li>').join('')+'</ol>'}
function run(mode,id){const phases=['確認本次資料與範圍','依條件比對原文證據','整理結果與待確認事項'];let n=0;const body=$('body-'+id),phase=$('phase-'+id);function tick(){if(!body.isConnected)return;if(n<3){phase.textContent='分析中 · '+(n+1)+'/3';body.innerHTML=steps(n)+tangle(mode,id,true)+'<h2>'+phases[n]+'</h2><div class="progress"><i style="width:'+((n+1)*33)+'%"></i></div><p class="muted">這張元件持續更新，不另發一串進度訊息。預寫流程模擬中。</p>';n++;scroll();timer=setTimeout(tick,1000)}else{const r={id,mode,time:new Date().toLocaleTimeString('zh-TW')};records.push(r);$('count').textContent=records.length;phase.textContent='分析完成';body.innerHTML=result(r);currentId=id;scroll()}}tick()}

 {left:'未建住宿設施',right:'住宿設施條件',state:'excluded',label:'前提不成立',evidence:'額外虛構情境：「本次僅辦活動，不新建住宿設施。」',reason:'明確事實排除此示範條件，與「資料不足」不同。這不是正式法規結論。'}]};
function tangle(mode,id,running){const a=relationData[mode],color=mode==='match'?'#d2ab65':'#9b8acb';let svg='<svg viewBox="0 0 680 345" role="img" aria-label="可點選的條件關係圖"><text x="35" y="25" font-size="13">'+(mode==='match'?'青禾社區':'計畫事實')+'</text><text x="485" y="25" font-size="13">'+(mode==='match'?'好日團隊':'比對條件')+'</text><circle cx="58" cy="170" r="25" fill="#252e3d" stroke="#8b9bae"/><circle cx="620" cy="170" r="25" fill="#252e3d" stroke="#8b9bae"/>';
a.forEach((r,i)=>{let y=70+i*74;let c=r.state==='bridge'?color:r.state==='missing'?'#8d94a5':r.state==='orphan'?'#df8e7d':'#64867c';let dash=r.state==='missing'?' waiting':running&&r.state==='bridge'?' moving':'';let path=r.state==='orphan'?'M 170 '+y+' L 270 '+y:r.state==='excluded'?'M 170 '+y+' L 315 '+y+' M 365 '+y+' L 510 '+y:'M 170 '+y+' C 280 '+y+',400 '+y+',510 '+y;svg+='<g class="hit" role="button" tabindex="0" aria-label="'+r.label+'：'+r.left+'" onclick="bridge(&#39;'+mode+'&#39;,'+id+','+i+')" onkeydown="if(event.key===&#39;Enter&#39;||event.key===&#39; &#39;){event.preventDefault();bridge(&#39;'+mode+'&#39;,'+id+','+i+')}" >';svg+='<rect x="105" y="'+(y-25)+'" width="470" height="49" fill="transparent"/><path d="M 80 160 Q 110 '+y+' 170 '+y+' M 595 160 Q 560 '+y+' 510 '+y+'" fill="none" stroke="#576172"/><path class="edge'+dash+'" d="'+path+'" stroke="'+c+'"/><circle cx="170" cy="'+y+'" r="5" fill="'+(r.state==='missing'?'#141820':c)+'" stroke="'+c+'"/><circle cx="'+(r.state==='orphan'?270:510)+'" cy="'+y+'" r="5" fill="#141820" stroke="'+c+'" class="'+(r.state==='orphan'?'orphan':'')+'"/><text x="115" y="'+(y-12)+'" font-size="12">'+r.left+'</text><text x="455" y="'+(y-12)+'" font-size="12">'+r.right+'</text><rect x="280" y="'+(y-11)+'" width="115" height="22" rx="11" fill="#202733"/><text x="337" y="'+(y+4)+'" text-anchor="middle" font-size="11">'+r.label+'</text></g>';});svg+='</svg>';return '<div class="tangle" id="tangle-'+id+'"><button class="expand" onclick="expandGraph('+id+')">展開／收回 ⛶</button><div class="muted">焦點關係 · 點選任一條件查看依據</div>'+svg+'<div class="legend"><span>— 有依據的關聯</span><span>┄ 資料不足</span><span>○ 落空／缺口</span><span>斷開＝前提不成立</span></div><div class="bridge-detail" id="bridge-'+id+'" aria-live="polite">'+(running?'逐項核對中；線條流動只表示處理進度，不表示資源已移轉。':'這不是交集圖。每一條線都對應一項可檢視的關係；顏色不代表分數。')+'</div><div class="warning">所有文字與關係均為虛構；額外情境用來示範缺口及排除狀態。節點距離不表示適配度或法律風險。</div></div>'}
function bridge(mode,id,i){const r=relationData[mode][i];$('bridge-'+id).innerHTML='<b>'+esc(r.left)+' → '+esc(r.right)+' · '+r.label+'</b><br>'+esc(r.evidence)+'<br>'+esc(r.reason)}
function expandGraph(id){$('tangle-'+id).classList.toggle('full')}

function result(r){const d=data[r.mode];return steps(2)+'<div class="muted">'+d.target+' · 示範版本 #'+r.id+'</div>'+tangle(r.mode,r.id,false)+'<h2 class="summary">'+d.conclusion+'</h2><div class="axes"><div class="axis"><small>有依據的部分</small><b>'+d.one+'</b></div><div class="axis"><small>尚未確定的部分</small><b>'+d.two+'</b></div><div class="axis"><small>建議下一步</small><b>'+d.three+'</b></div></div><details class="disclosure"><summary>為什麼這樣判斷？查看原文與條件</summary><div class="evidence">'+esc(d.quote).replace(/\n/g,'<br>')+'</div><p>'+d.reason+'</p><div class="muted">條件設定 v0.2 · 示範原文 v0.2 · 未使用真實模型</div></details><div class="actions"><button class="primary" onclick="openReport('+r.id+')">開啟完整報告 ↗</button><button onclick="followup('+r.id+')">追問／補充資料</button></div><div class="warning">'+d.limit+'</div><div class="muted">本次紀錄 '+r.time+' · 暫存在此頁，重新整理後消失</div>'}
function openReport(id){const r=records.find(x=>x.id===id),d=data[r.mode];$('sheet').innerHTML='<header><strong>分析報告／示範 #'+id+'</strong><button onclick="closeReport()">關閉 ✕</button></header><p class="muted">AI-Eva · '+names[r.mode]+' · '+r.time+'</p><h1>'+d.conclusion+'</h1><p>'+d.target+'</p><h2>01 分析對象與範圍</h2><p>虛構專案計畫理念，依預寫條件示範。未連接正式站資料、未使用 AI 判定。</p><h2>02 判斷與依據</h2><div class="evidence">'+esc(d.quote).replace(/\n/g,'<br>')+'</div><p>'+d.reason+'</p><h2>03 尚待確認</h2><p>'+d.two+'。'+d.limit+'</p><h2>04 建議下一步</h2><p>'+d.three+'。本頁建議不會直接修改專案或觸發邀請。</p><h2>05 版本與限制</h2><p>示範原文 v0.2 ／條件設定 v0.2 ／無真實模型。這不是'+(r.mode==='match'?'合作承諾或成果報告':'法律意見或合規認證')+'。</p><div class="actions"><button onclick="download('+id+')">下載文字報告</button><button onclick="window.print()">列印／另存 PDF</button></div>';$('report').classList.add('open');$('sheet').querySelector('button').focus()}
function closeReport(){$('report').classList.remove('open')}function inputView(mode){ai('<p>本次輸入（虛構示範原文）：</p><div class="evidence">'+esc(data[mode].quote).replace(/\n/g,'<br>')+'</div><p class="muted">這是固定版本，後續報告依此引用，不會假裝讀過整份 PDF。</p>')}
function followup(id){currentId=id;ai('<p>你想確認哪個依據，或補充哪些資訊？</p><div class="chips"><button onclick="explain('+id+')">為什麼不是直接給肯定結論？</button><button onclick="supplement('+id+')">模擬補充資料並重跑</button></div>');$('input').focus()}
function explain(id){user('為什麼不是直接給肯定結論？');ai('<p>'+data[records.find(x=>x.id===id).mode].reason+'</p><p>有資料支持的部分才判斷；沒寫到的部分保持待確認，而不是替你補值。</p>')}
function supplement(id){const r=records.find(x=>x.id===id);user('我想補充資料，再重新分析。');ai('<p>正式流程會先讓你確認補充內容與保存位置。此原型不保存資料，也不假裝補充已生效；以下只重跑相同示範，新增一版紀錄。</p>');const nid=++seq;ai(frame(r.mode,nid,'setup'))}
function historyView(){ai('<h2>這次對話的分析紀錄</h2><p class="muted">兩種場景用同一份紀錄格式。暫存於此頁，並非後端永久保存。</p>'+(records.length?records.map(r=>'<div class="historyrow"><span>'+names[r.mode]+' #'+r.id+' · '+r.time+'</span><button onclick="openReport('+r.id+')">檢視報告</button></div>').join(''):'<p class="empty">尚無分析紀錄。</p>'))}function showThread(){scroll()}
function send(e){e.preventDefault();let s=$('input').value.trim();if(!s)return;$('input').value='';if(s.includes('法規'))choose('law');else if(s.includes('媒合'))choose('match');else if(s.includes('紀錄'))historyView();else{user(s);ai('<p>這版只模擬互動，不呼叫 AI。你可以選「媒合分析」「法規檢核」，或在完成結果下展開依據、追問與報告。</p>')}}
function download(id){openReport(id);const c=$('sheet').cloneNode(true);c.querySelectorAll('button').forEach(e=>e.remove());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.innerText||c.textContent],{type:'text/plain;charset=utf-8'}));a.download='AI-Eva-示範分析-'+id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReport()});$('report').addEventListener('click',e=>{if(e.target===$('report'))closeReport()});reset();

// Shared layout controller. Move the same analysis node: never clone its state.
const main=document.querySelector('.main'),threadEl=$('thread'),composer=document.querySelector('.composer-wrap');
const layout=document.createElement('div');layout.className='stage-layout';main.append(layout);
const desk=document.createElement('section');desk.className='desk';desk.setAttribute('aria-label','策略工作區');desk.innerHTML='<div class="desk-top"><div><small>AI-EVA / SHARED WORKSPACE</small><h2 id="deskTitle">策略工作區</h2></div><div class="desk-actions"><button class="mobile-toggle" onclick="mobileChat()">對話 ⇄</button><button onclick="collapseDesk()">收合 ↗</button></div></div><div id="deskMount"></div><div class="desk-foot">同一個工作區・原文、條件與判斷可追溯。雲林公開計畫理念固定快照，不連接正式系統。</div>';layout.append(desk);
const chatPane=document.createElement('div');chatPane.className='chat-pane';layout.append(chatPane);const context=document.createElement('div');context.className='context';context.innerHTML='<span id="focusText">圍繞本次分析繼續對話</span> <button class="mobile-toggle" onclick="mobileChat()">回到圖面</button>';chatPane.append(context,threadEl,composer);
let activeNode=null,activeSlot=null,savedScroll=0;
function openDesk(mode,id){const node=$('analysis-'+id);if(!node)return;if(activeNode&&activeNode!==node&&activeSlot)activeSlot.append(activeNode);savedScroll=threadEl.scrollTop;activeNode=node;activeSlot=document.querySelector('[data-slot="'+id+'"]');$('deskMount').append(node);$('deskTitle').textContent=names[mode]+' / 青禾社區';$('focusText').textContent='正在討論：'+names[mode]+' #'+id;currentId=id;document.body.classList.add('workspace-open');document.body.classList.remove('mobile-chat');context.dataset.mode=mode;threadEl.scrollTop=savedScroll}
function collapseDesk(){document.body.classList.remove('workspace-open','mobile-chat');if(activeNode&&activeSlot)activeSlot.append(activeNode);requestAnimationFrame(()=>{threadEl.scrollTop=savedScroll})}
function mobileChat(){document.body.classList.toggle('mobile-chat')}
choose=function(mode){currentMode=mode;user('我想做'+names[mode]);const id=++seq;ai('<p>已開啟工作區，請先確認本次分析對象。</p><div class="receipt"><small>本次分析 / '+names[mode]+'</small><p id="yl-receipt-'+id+'">'+(typeof ylDefault==='function'?ylDefault(mode):data[mode].target)+'</p><button onclick="launchDesk(&#39;'+mode+'&#39;,'+id+')">重新開啟'+names[mode]+'工作區 ↗</button></div><div data-slot="'+id+'" hidden>'+frame(mode,id,'setup')+'</div>');launchDesk(mode,id)};
function launchDesk(mode,id){openDesk(mode,id)}
const bridgeOriginal=bridge;bridge=function(mode,id,i){bridgeOriginal(mode,id,i);$('focusText').textContent='目前焦點：'+relationData[mode][i].left+' → '+relationData[mode][i].right;currentId=id};
const sendOriginal=send;send=function(e){const s=$('input').value.trim();if(!s||!document.body.classList.contains('workspace-open')||s.includes('媒合')||s.includes('法規')||s.includes('紀錄')){sendOriginal(e);return}e.preventDefault();$('input').value='';user(s);ai('<p><small class="muted">'+esc($('focusText').textContent)+'</small></p><p>這版先示範「圖固定、對話繼續」的操作。正式版會依選取關係回答；目前不呼叫 AI，也不將你的文字當成已確認事實。</p><p>你可以繼續點圖上的另一條關係，或開啟完整報告。</p>')};
const resetOriginal=reset;reset=function(){if(activeNode&&activeSlot)activeSlot.append(activeNode);activeNode=null;activeSlot=null;document.body.classList.remove('workspace-open','mobile-chat');resetOriginal()};
// Collapsing leaves a compact re-open entry, not a large duplicate diagram.
collapseDesk=function(){document.body.classList.remove('workspace-open','mobile-chat');if(activeNode&&activeSlot){activeSlot.append(activeNode);activeSlot.hidden=true}requestAnimationFrame(()=>{threadEl.scrollTop=savedScroll})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('report').classList.contains('open'))collapseDesk()});
