name: CodeBoarding web

on:
  push:
    branches: [main]
    paths:
      - '.codeboarding/analysis.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: codeboarding-web
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build arch web
        run: python3 arch/build.py arch/index.html
      - name: Commit rendered web
        run: |
          git config user.name "codeboarding-bot"
          git config user.email "actions@users.noreply.github.com"
          git add arch/index.html
          git diff --cached --quiet || git commit -m "[bot] ci: 更新架構圖 web" && git push