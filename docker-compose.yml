services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-eva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit_local
      POSTGRES_DB: chainlit
    volumes:
      - ai_eva_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-eva:
    build: .
    image: ai-eva
    container_name: ai-eva
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CMS_SDG_SERVICE_TOKEN: ${CMS_SDG_SERVICE_TOKEN:-}
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./.chainlit:/app/.chainlit
      - ./public:/app/public
    extra_hosts:
      - "host.docker.internal:host-gateway"

  litellm-db:
    image: postgres:16-alpine
    container_name: ai-eva-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_local
      POSTGRES_DB: litellm
    volumes:
      - ai_eva_litellm_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5500:5432"   # 只開 localhost 給 LiteLLM (host network) 連
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ai-eva-litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    # 只傳真正需要的 env，不要 inherit Chainlit 的 DATABASE_URL
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:litellm_local@127.0.0.1:5500/litellm
      STORE_MODEL_IN_DB: "True"     # 允許 Admin UI 在 DB 加 model
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-${LITELLM_MASTER_KEY}}    # UI 登入密碼；沒設 → 退回 master key
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    network_mode: host    # 為了能直接打 Pi5 Tailscale IP (100.74.6.41)

  session-scanner:
    # 每 60s 戳 ai-eva 的 /tasks/scan-timeouts，掃 idle 過久的 LINE session，
    # mark ended + push 告別訊息。container 內部走 ai-eva:7860（同 compose network）。
    image: curlimages/curl:8.10.1
    container_name: ai-eva-session-scanner
    restart: unless-stopped
    depends_on:
      - ai-eva
    environment:
      SESSION_SCAN_TOKEN: ${SESSION_SCAN_TOKEN}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST http://ai-eva:7860/tasks/scan-timeouts \
            -H "X-Scan-Token: $$SESSION_SCAN_TOKEN" \
            >/dev/null 2>&1 || true
          sleep 60
        done

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai-eva-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ai_eva_rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    # 不用 host network — 預設 bridge + ports 即可（Tailscale 從 Pi5 連 cms-server
    # 的 Tailscale IP 100.66.105.30:5672 就會走 host port forwarding 進來）
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  ai_eva_pgdata:
  ai_eva_litellm_pgdata:
  ai_eva_rabbitmq:
