services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-eva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit_local
      POSTGRES_DB: chainlit
    volumes:
      - ai_eva_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-eva:
    build: .
    image: ai-eva
    container_name: ai-eva
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./.chainlit:/app/.chainlit
      - ./public:/app/public
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ai_eva_pgdata:
