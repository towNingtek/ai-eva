model_list:
- model_name: cloud-fast
  litellm_params:
    model: openai/gpt-4o-mini
    api_key: os.environ/OPENAI_API_KEY
- model_name: local-cheap
  litellm_params:
    model: ollama_chat/qwen2.5:3b-instruct-q4_K_M
    api_base: http://100.74.6.41:11434
- model_name: default
  litellm_params:
    model: openai/gpt-4o-mini
    api_key: os.environ/OPENAI_API_KEY
- model_name: openai-5.4-xiaozhen
  litellm_params:
    model: openai/gpt-5.4
    api_key: os.environ/OPENAI_API_KEY
- model_name: nvidia-llama
  litellm_params:
    model: openai/meta/llama-3.1-70b-instruct
    api_key: os.environ/NVIDIA_API_KEY
    api_base: https://integrate.api.nvidia.com/v1
- model_name: nvidia-nemotron-ultra
  litellm_params:
    model: openai/nvidia/nemotron-3-ultra-550b-a55b
    api_key: os.environ/NVIDIA_API_KEY
    api_base: https://integrate.api.nvidia.com/v1
- model_name: nvidia-gpt-oss
  litellm_params:
    model: openai/openai/gpt-oss-120b
    api_key: os.environ/NVIDIA_API_KEY
    api_base: https://integrate.api.nvidia.com/v1
- model_name: nvidia-embed
  litellm_params:
    model: openai/nvidia/llama-nemotron-embed-1b-v2
    input_type: query
    api_key: os.environ/NVIDIA_API_KEY
    api_base: https://integrate.api.nvidia.com/v1
- model_name: nvidia-nemotron-super
  litellm_params:
    model: openai/nvidia/nemotron-3-super-120b-a12b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: os.environ/NVIDIA_API_KEY
- model_name: nvidia-kimi-k3
  litellm_params:
    model: openai/moonshotai/kimi-k3
    api_base: https://integrate.api.nvidia.com/v1
    api_key: os.environ/NVIDIA_API_KEY
- model_name: nvidia-embed-v1
  litellm_params:
    model: openai/nvidia/nv-embed-v1
    input_type: query
    api_base: https://integrate.api.nvidia.com/v1
    api_key: os.environ/NVIDIA_API_KEY
router_settings:
  fallbacks:
  - local-cheap:
    - cloud-fast
  num_retries: 1
  timeout: 60
