# LiteLLM proxy config — ai-eva LLM gateway
#
# 三個 model 別名：
#   cloud-fast  → OpenAI gpt-4o-mini（互動主線、快速、品質高）
#   local-cheap → Pi5 Qwen 2.5:3b-q4 via Tailscale（被動推播 / 省錢節點）
#   default     → 同 cloud-fast（給沒指定 model 的 client 用）
#
# Fallback：local-cheap 失敗（Pi5 掛了 / Tailscale 斷）→ 自動回 cloud-fast

model_list:
  - model_name: cloud-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: local-cheap
    litellm_params:
      model: ollama_chat/qwen2.5:3b-instruct-q4_K_M
      api_base: http://100.74.6.41:11434   # Pi5 Tailscale IP

  - model_name: default
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 雲林正式商業模型（付費；金鑰沿用 xiaozhen 的 OPENAI_API_KEY）
  - model_name: openai-5.4-xiaozhen
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  # ===== NVIDIA NIM 免費 endpoint（多模型對照用）=====
  - model_name: nvidia-llama
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-deepseek
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-qwen
    litellm_params:
      model: nvidia_nim/qwen/qwen3-next-80b-a3b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-minimax
    litellm_params:
      model: nvidia_nim/minimaxai/minimax-m2.7
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-glm
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.1
      api_key: os.environ/NVIDIA_API_KEY

  # ===== 2026-06-27 擴充:NVIDIA build 旗艦/升級/工作用(全免費)=====
  - model_name: nvidia-llama33
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-llama4
    litellm_params:
      model: nvidia_nim/meta/llama-4-maverick-17b-128e-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-deepseek-pro
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-qwen35
    litellm_params:
      model: nvidia_nim/qwen/qwen3.5-397b-a17b
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-kimi
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k2.6
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-nemotron-ultra
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-mistral-large
    litellm_params:
      model: nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-gpt-oss
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY

  # 工作用(特殊端點:parse=文件解析, embed=向量化, phi4-mm=多模態)
  - model_name: nvidia-parse
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-parse
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-embed
    litellm_params:
      model: nvidia_nim/nvidia/llama-nemotron-embed-1b-v2
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: nvidia-phi4-mm
    litellm_params:
      model: nvidia_nim/microsoft/phi-4-multimodal-instruct
      api_key: os.environ/NVIDIA_API_KEY

router_settings:
  fallbacks:
    - local-cheap: ["cloud-fast"]
  num_retries: 1
  timeout: 60
